# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build Thunderstore Mod

on:
  push:
    branches:
      - br2
  pull_request:
    branches: 
      - br2
  workflow_dispatch:
    inputs:
      project:
        description: "Path to csproj"
        required: true
        type: string
      dist_name:
        description: "Name of mod"
        required: false
        type: string
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --output "export"
    - name: Get Distribution Name
      id: getter
      run: |
        DIST_NAME="${{inputs.dist_name}}"
        [ -z ${DIST_NAME} ] && DIST_NAME=$(dotnet msbuild -getProperty:AssemblyTitle ${{ inputs.project }})
        VERSION=$(dotnet msbuild -getProperty:Version ${{ inputs.project }})
        echo "DIST_NAME=$DIST_NAME" >> $GITHUB_OUTPUT
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
    - name: Copy distribution files
      run: |
        cp ./README.md ./export/
        cp ./dist/icon.png ./export/
        REPO_GH_DESC=$(curl -L -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ github.token }}" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${{ github.repository }} | python -c 'import sys, json; print(json.load(sys.stdin)["description"])')
        echo '{"name": "${{ steps.getter.outputs.DIST_NAME }}", "description":"'$REPO_GH_DESC'", "version_number": "${{ steps.getter.outputs.VERSION }}", "website_url": "${{ github.repositoryUrl }}"}' > ./export/manifest.json
        
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: SimpleSilksongLocalizer-${{github.ref_name}}
        # A file, directory or wildcard pattern that describes what to upload
        path: "export"

          
